# Replay a recorded dump1090 raw stream (no SDR required).
# Capture next to this file (paths are resolved relative to the YAML):
#   mkdir -p src/pyaerial/examples/captures
#   nc localhost 30002 > src/pyaerial/examples/captures/adsb.raw
#
# Lines may be bare hex (`8DABCDEF...`) or `timestamp hex`.
# Untimestamped lines are emitted as fast as the engine can take (interval: 0).
# `speed` only scales timestamped captures (realtime multiplier).
# Then: pyaerial run -c src/pyaerial/examples/replay.yaml
#
# validate requires captures/adsb.raw to exist.

database:
  path: pyaerial.db
  redis_uri: redis://localhost:6379/0

home:
  latitude: 35.727488
  longitude: -78.695942

receivers:
  recorded:
    type: replay
    options:
      path: captures/adsb.raw
      speed: 4.0
      interval: 0
      loop: true

zones: {}
