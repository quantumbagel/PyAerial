# Replay a recorded dump1090 raw stream (no SDR required).
# Capture next to this file (paths are resolved relative to the YAML):
#   mkdir -p src/pyaerial/examples/captures
#   nc localhost 30002 > src/pyaerial/examples/captures/adsb.raw
#
# Lines may be bare hex (`8DABCDEF...`), dump1090 `@CLOCKHEX;`, or `timestamp hex`.
# `@CLOCKHEX;` lines pace from the 12 MHz dump1090 clock. Untimestamped lines
# use `interval` (default 0.1s). This example sets 0 for a fast dump.
# `speed` scales timestamped and clocked delays.
# Then: pyaerial run -c src/pyaerial/examples/replay.yaml
#
# validate requires captures/adsb.raw to exist.

database:
  path: pyaerial.db
  redis_uri: redis://localhost:6379/0

home:
  latitude: 35.727488
  longitude: -78.695942

receivers:
  recorded:
    type: replay
    options:
      path: captures/adsb.raw
      speed: 4.0
      interval: 0
      loop: true

zones: {}
