# Replay a recorded dump1090 stream (no SDR or Redis feeder required).
#
# captures/adsb.raw ships with PyAerial: about 2.5 minutes of synthetic traffic
# (6 aircraft around Raleigh, NC, one passing low over `home`), regenerated by
# scripts/make_sample_capture.py. Paths are resolved relative to this YAML.
#
# To record your own (dump1090 --net --mlat writes `@CLOCKHEX;` AVR lines):
#   nc localhost 30002 > src/pyaerial/examples/captures/mine.raw
# Beast binary captures (`nc localhost 30005 > capture.bin`) also work.
#
# Lines may be bare hex (`8DABCDEF...`), `*HEX;`, `@CLOCKHEX;`, or `timestamp hex`.
# `@CLOCKHEX;` lines (and Beast captures) pace from the 12 MHz dump1090 clock,
# which also feeds the squitter-timing integrity check. Untimestamped lines are
# spaced by `interval` seconds.
#
# Then: pyaerial run -c src/pyaerial/examples/replay.yaml

database:
  path: pyaerial.db
  redis_uri: redis://localhost:6379/0

home:
  latitude: 35.727488
  longitude: -78.695942

receivers:
  recorded:
    type: replay
    options:
      path: captures/adsb.raw
      # Keep 1.0. Frames are stamped with the time they are replayed, so any
      # other speed compresses (or stretches) time: aircraft appear to move
      # `speed` times faster than the velocity they report, and the kinematics
      # and timing integrity checks flag every one of them as spoofed.
      speed: 1.0
      interval: 0.1
      # A loop restarts every aircraft at its first position, which looks like
      # a second transmitter on the same address (flagged suspect for a while).
      loop: false

zones: {}
