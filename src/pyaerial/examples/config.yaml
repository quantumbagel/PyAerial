database:
  uri: mongodb://localhost:27017
  redis_uri: redis://localhost:6379/0

tracking:
  hz: 2
  remember_planes: 30
  backdate_packets: 10
  duplicate_packet_merging: 5
  status_message_top_planes: 5
  advanced_status: true
  telemetry_keep_seconds: 600
  # use_kalman_eta: true
  # curved_projection: true

logging:
  level: info

home:
  latitude: 36.6810752
  longitude: -78.8758528

# web:
#   token: "shared-secret"   # optional; require ?token= on /ws/live

receivers:
  main:
    type: dump1090
    host: localhost
    port: 30002
  # recorded:
  #   type: replay
  #   options:
  #     path: captures/adsb.raw
  #     speed: 1.0
  #     loop: true

zones:
  main:
    # Inline [latitude, longitude] rings, or:
    # file: zone.geojson   # .kml / .kmz / .geojson relative to this config
    coordinates:
      - [35.753821, -78.909304]
      - [35.755597, -78.904969]
      - [35.756642, -78.898232]
      - [35.755214, -78.892738]
      - [35.753333, -78.888490]
      - [35.749293, -78.889606]
      - [35.747343, -78.891494]
      - [35.746507, -78.895742]
      - [35.747482, -78.900806]
      - [35.748910, -78.906085]
      - [35.751348, -78.910205]
    rules:
      - name: warn
        when:
          altitude: { max: 1000 }
          eta: { max: 120 }
        dwell_seconds: 60
        # hysteresis_seconds: 15
        # predict_seconds: 20
        on_activate:
          - method: print
        retain: true
      - name: alert
        when:
          altitude: { max: 500 }
          eta: { max: 60 }
        dwell_seconds: 60
        on_activate:
          - method: print
        retain: true
