services:
  dump1090:
    image: pyaerial:latest
    container_name: pyaerial_dump1090
    restart: always
    build:
      context: .
    profiles: ["sdr"]
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    expose:
      - "30002"
      - "30005"
    command: ["/opt/dump1090/dump1090", "--net", "--raw", "--quiet"]
  pyaerial:
    image: pyaerial:latest
    container_name: pyaerial
    restart: always
    build:
      context: .
    depends_on:
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pyaerial_data:/data
      - ./config.yaml:/opt/PyAerial/config.yaml:ro
    environment:
      PYAERIAL_CONFIG: /opt/PyAerial/config.yaml
      PYAERIAL_START_DUMP1090: "0"
      PYAERIAL_HISTORY: /data/pyaerial.db
      PYAERIAL_AIRCRAFT_DB: /data/aircraft.db
      PYAERIAL_REDIS: redis://:${REDIS_PASSWORD:-pyaerial}@redis:6379/0
      # Without --profile sdr there is no dump1090 container; default to a host feeder.
      # With --profile sdr, set DUMP1090_HOST=dump1090.
      DUMP1090_HOST: ${DUMP1090_HOST:-host.docker.internal}
    command: ["pyaerial", "run", "-c", "/opt/PyAerial/config.yaml"]
  web:
    image: pyaerial:latest
    container_name: pyaerial_web
    restart: always
    depends_on:
      - redis
      - pyaerial
    volumes:
      - pyaerial_data:/data
      - ./config.yaml:/opt/PyAerial/config.yaml:ro
    ports:
      - "10090:10090"
      - "30005:30005"
    environment:
      PYAERIAL_CONFIG: /opt/PyAerial/config.yaml
      PYAERIAL_START_DUMP1090: "0"
      PYAERIAL_HISTORY: /data/pyaerial.db
      PYAERIAL_AIRCRAFT_DB: /data/aircraft.db
      PYAERIAL_REDIS: redis://:${REDIS_PASSWORD:-pyaerial}@redis:6379/0
      PYAERIAL_BEAST_PORT: "30005"
    command:
      [
        "pyaerial",
        "web",
        "-c",
        "/opt/PyAerial/config.yaml",
        "--host",
        "0.0.0.0",
        "--port",
        "10090",
      ]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10090/ready')"]
      interval: 15s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: pyaerial_redis
    restart: always
    command: redis-server --save "" --appendonly no --requirepass ${REDIS_PASSWORD:-pyaerial}

volumes:
  pyaerial_data:
