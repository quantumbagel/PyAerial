services:
  dump1090:
    image: pyaerial:latest
    container_name: pyaerial_dump1090
    restart: always
    build:
      context: .
    profiles: ["sdr"]
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    expose:
      - "30002"
    command: ["/opt/dump1090/dump1090", "--net", "--raw", "--quiet"]
  pyaerial:
    image: pyaerial:latest
    container_name: pyaerial
    restart: always
    build:
      context: .
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYAERIAL_CONFIG: /opt/PyAerial/config.yaml
      PYAERIAL_START_DUMP1090: "0"
      PYAERIAL_MONGODB: mongodb://pyaerial:${MONGO_PASSWORD:-pyaerial}@mongodb:27017/?authSource=admin
      PYAERIAL_REDIS: redis://:${REDIS_PASSWORD:-pyaerial}@redis:6379/0
      # With --profile sdr this is the dump1090 service. Without SDR, set
      # DUMP1090_HOST to an existing receiver (e.g. host.docker.internal).
      DUMP1090_HOST: ${DUMP1090_HOST:-dump1090}
    command: ["pyaerial", "run", "-c", "/opt/PyAerial/config.yaml"]
  web:
    image: pyaerial:latest
    container_name: pyaerial_web
    restart: always
    depends_on:
      - mongodb
      - redis
      - pyaerial
    ports:
      - "10090:10090"
    environment:
      PYAERIAL_CONFIG: /opt/PyAerial/config.yaml
      PYAERIAL_START_DUMP1090: "0"
      PYAERIAL_MONGODB: mongodb://pyaerial:${MONGO_PASSWORD:-pyaerial}@mongodb:27017/?authSource=admin
      PYAERIAL_REDIS: redis://:${REDIS_PASSWORD:-pyaerial}@redis:6379/0
    command:
      [
        "pyaerial",
        "web",
        "-c",
        "/opt/PyAerial/config.yaml",
        "--host",
        "0.0.0.0",
        "--port",
        "10090",
      ]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10090/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
  mongodb:
    image: mongo:7
    container_name: pyaerial_database
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: pyaerial
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pyaerial}
    volumes:
      - pyaerial_mongo:/data/db
  redis:
    image: redis:7-alpine
    container_name: pyaerial_redis
    restart: always
    command: redis-server --save "" --appendonly no --requirepass ${REDIS_PASSWORD:-pyaerial}

volumes:
  pyaerial_mongo:
