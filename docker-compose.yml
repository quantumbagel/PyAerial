services:
  pyaerial:
    image: pyaerial:latest
    container_name: pyaerial
    restart: always
    build:
      context: .
      network: host
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    depends_on:
      - mongodb
      - redis
    network_mode: host
    environment:
      PYAERIAL_CONFIG: /opt/PyAerial/config.yaml
  web:
    image: pyaerial:latest
    container_name: pyaerial_web
    restart: always
    network_mode: host
    depends_on:
      - mongodb
      - redis
      - pyaerial
    environment:
      PYAERIAL_CONFIG: /opt/PyAerial/config.yaml
    command: pyaerial web -c /opt/PyAerial/config.yaml
  mongodb:
    image: mongo:7
    container_name: pyaerial_database
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - pyaerial_mongo:/data/db
    network_mode: host
  redis:
    image: redis:7-alpine
    container_name: pyaerial_redis
    restart: always
    # Pure in-memory live cache (Mongo is the durable store). Disabling RDB/AOF
    # persistence avoids MISCONF write-refusals when a bgsave fails (e.g. full disk).
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    network_mode: host

volumes:
  pyaerial_mongo:
