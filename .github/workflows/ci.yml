name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Test against the exact pins the Docker image ships, not floating floors.
      - name: Install locked runtime deps
        run: pip install --require-hashes -r requirements.lock
      # Dev tools are pinned so a new release cannot turn CI red overnight.
      - name: Install pyaerial and dev tools
        run: >-
          pip install --no-deps -e . &&
          pip install pytest==9.2.0 httpx==0.28.1 ruff==0.17.3 import-linter==2.15
          mypy==2.4.1
      - name: Tests
        run: pytest
      # web/src/api/schema.json and generated.ts match pyaerial.api.models.
      - name: Generated wire types
        run: python scripts/gen_types.py --check
      - name: Ruff
        run: ruff check src tests
      # Package layering ([tool.importlinter] in pyproject.toml).
      - name: Import layers
        run: lint-imports
      # [tool.mypy] in pyproject.toml.
      - name: Types
        run: mypy

  package:
    # The wheel must carry the built portal: `pyaerial web` serves it from there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the portal
        run: scripts/build_web.sh
      - name: Build sdist and wheel
        run: python -m pip install build==1.6.1 && python -m build
      - name: Wheel contains the portal
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = set(zipfile.ZipFile(wheel).namelist())
          assert "pyaerial/static/index.html" in names, "portal missing from the wheel"
          assert any(n.startswith("pyaerial/static/assets/") for n in names), "no portal assets"
          print(wheel, "carries the portal")
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Match the Dockerfile: later 22.x releases break loading tsc.
          node-version: "22.16"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      # PYSEC-2026-4320 (certifi emSign roots): the only fix, certifi 2026.10.19,
      # was uploaded 2026-10-20T02:24Z, inside the lockfile's 14-day cooldown
      # until 2026-11-04. Then run `scripts/lock.sh --upgrade-package certifi`
      # and drop this ignore. (setuptools is already locked past its advisory.)
      - run: >-
          pip-audit --require-hashes --disable-pip -r requirements.lock
          --ignore-vuln PYSEC-2026-4320

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16"
      - run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan history
        run: gitleaks git --config .github/gitleaks.toml --redact --verbose .
