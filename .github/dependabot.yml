version: 2

# cooldown: let new releases age for two weeks before proposing them (security
# updates are not delayed). Regenerate requirements.lock with scripts/lock.sh if a
# pip PR leaves it inconsistent with pyproject.toml.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # pyproject floors are minimums, not pins: raise one only when a release
    # falls outside it (or for security). requirements.lock carries the tested
    # versions and is refreshed with scripts/lock.sh.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      web:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x supports typescript <6.1 only (typescript-eslint#10940).
      - dependency-name: typescript
        versions: [">= 7"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Stay on Node 22 to match CI; move minors deliberately with CI and Dockerfile.
      - dependency-name: node
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Stay on the redis 7.x line until an 8.x upgrade is tested.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
