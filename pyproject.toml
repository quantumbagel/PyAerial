[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaerial"
version = "0.20.2"
description = "ADS-B / Mode S tracking with polygon zone rules, alerts, Redis live state, and SQLite history."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julian Reder", email = "quantumbagel@example.com" }]
license = { text = "GPL-3.0-or-later" }
keywords = ["ads-b", "modes", "aviation", "geofence", "tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "shapely>=2.0",
    "geopy>=2.4",
    "pyModeS>=3.0.0",
    "requests>=2.31",
    "redis>=5.0",
    "ruamel.yaml>=0.18",
    "pydantic>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/quantumbagel/PyAerial"
Repository = "https://github.com/quantumbagel/PyAerial"

[project.scripts]
pyaerial = "pyaerial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyaerial = ["examples/*", "static/*", "static/**/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
