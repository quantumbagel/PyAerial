[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaerial"
version = "0.22.0"
description = "ADS-B receiver network with spoofing checks, a labelled research archive, and zone alerts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julian Reder", email = "quantumbagel@example.com" }]
license = { text = "GPL-3.0-or-later" }
keywords = ["ads-b", "modes", "aviation", "geofence", "tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "shapely>=2.2.0",
    "geopy>=2.5.0",
    "pyModeS>=3.6.0",
    "requests>=2.34.2",
    # Transitive (via requests); floors keep resolvers past known CVEs.
    "urllib3>=2.8.0",
    "idna>=3.20",
    "redis>=8.1.0",
    "ruamel.yaml>=0.19.1",
    "defusedxml>=0.7.1",
    "pydantic>=2.14.1",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "httpx>=0.28.1", "ruff>=0.17.0"]

[project.urls]
Homepage = "https://github.com/quantumbagel/PyAerial"
Repository = "https://github.com/quantumbagel/PyAerial"

[project.scripts]
pyaerial = "pyaerial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyaerial = ["examples/*", "static/*", "static/**/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "ASYNC", "RUF006", "SIM105", "UP035", "UP041", "PLW2901"]
ignore = ["E501"]
