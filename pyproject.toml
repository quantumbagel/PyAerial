[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaerial"
version = "0.22.0"
description = "ADS-B receiver network with spoofing checks, a labelled research archive, and zone alerts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julian Reder", email = "quantumbagel@example.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["ads-b", "modes", "aviation", "geofence", "tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # 2.0.4 is the first release that works with NumPy 2 (2.0.3 pins numpy<2).
    "shapely>=2.0.4",
    "geopy>=2.5.0",
    "pyModeS>=3.0.0",
    "requests>=2.33.0",
    # Transitive (via requests); floors keep resolvers past known CVEs.
    "urllib3>=2.8.0",
    "idna>=3.15",
    "redis>=5.0",
    "ruamel.yaml>=0.18",
    "defusedxml>=0.7.1",
    "pydantic>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "import-linter==2.15",
    "mypy==2.4.1",
]

[project.urls]
Homepage = "https://github.com/quantumbagel/PyAerial"
Repository = "https://github.com/quantumbagel/PyAerial"
Issues = "https://github.com/quantumbagel/PyAerial/issues"
Changelog = "https://github.com/quantumbagel/PyAerial/blob/master/CHANGELOG.md"

[project.scripts]
pyaerial = "pyaerial.cli:main"

# Plugins are discovered through these groups; a third-party distribution adds
# its own entries (see ARCHITECTURE.md). The builtins are listed here too.
[project.entry-points."pyaerial.receivers"]
aoa = "pyaerial.receivers.aoa:AoAReceiver"
dump1090 = "pyaerial.receivers.dump1090:Dump1090Receiver"
replay = "pyaerial.receivers.replay:ReplayReceiver"

[project.entry-points."pyaerial.alerters"]
print = "pyaerial.alerters.printer:PrintAlerter"
webhook = "pyaerial.alerters.webhook:WebhookAlerter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Listed explicitly so the wheel does not depend on MANIFEST.in grafts.
pyaerial = [
    "examples/*",
    "examples/captures/*",
    "static/*",
    "static/**/*",
    "static/assets/*",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.importlinter]
root_package = "pyaerial"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
# Higher layers may import lower ones, never the reverse; `|` siblings are
# independent of each other. `lint-imports` checks it (CI python job).
# - alerts sits above store: the alert engine records episodes in the live
#   store; the store depends on no domain logic (the archive policy is
#   decided by the engine and passed to ArchiveWriter.finalize_plane).
# - config.loader sits above the domain layers it validates against
#   (receiver/alerter registries, zone polygons via calc) and below the
#   entry points that load the config; config.schema is near the bottom.
layers = [
    "pyaerial.cli",
    "pyaerial.engine | pyaerial.webapp | pyaerial.view",
    "pyaerial.api | pyaerial.pipeline",
    "pyaerial.config.loader",
    "pyaerial.alerts",
    "pyaerial.alerters | pyaerial.store | pyaerial.enrich",
    "pyaerial.calc",
    "pyaerial.integrity",
    "pyaerial.tracker",
    "pyaerial.classify",
    "pyaerial.receivers",
    "pyaerial.config.schema | pyaerial.config.geofence_file",
    "pyaerial.models | pyaerial.logging_setup",
    "pyaerial.constants | pyaerial.units | pyaerial.jsonutil | pyaerial.urls | pyaerial.plugins",
]

[[tool.importlinter.contracts]]
name = "Archive reader and writer are independent"
type = "independence"
# The portal's read-only ArchiveReader never imports the writer (and so
# never its write paths); both share store.archive._conn and .schema.
modules = [
    "pyaerial.store.archive.reader",
    "pyaerial.store.archive.writer",
]

[[tool.importlinter.contracts]]
name = "Live reader and writer are independent"
type = "independence"
# The portal's read-only LiveReader never imports the engine's LiveWriter;
# both share store.live._conn, _raw, _reads and keys.
modules = [
    "pyaerial.store.live.reader",
    "pyaerial.store.live.writer",
]

[[tool.importlinter.contracts]]
name = "Live reader has no memory mirror or write paths"
type = "forbidden"
source_modules = ["pyaerial.store.live.reader"]
forbidden_modules = [
    "pyaerial.store.live._mirror",
    "pyaerial.store.live.episodes",
    "pyaerial.store.live.recovery",
    "pyaerial.store.memory",
]

[tool.mypy]
# Unannotated functions are type-checked too (check_untyped_defs), though
# missing annotations are not errors yet; third-party packages without stubs
# are Any.
python_version = "3.11"
files = ["src/pyaerial"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "ASYNC",
    "RUF006",
    "SIM105",
    "UP035",
    "UP041",
    "PLW2901",
]
ignore = ["E501"]
