database:
  path: pyaerial.db
  redis_uri: redis://localhost:6379/0

tracking:
  hz: 2
  remember_planes: 120
  backdate_packets: 10
  duplicate_packet_merging: 5
  status_message_top_planes: 5
  advanced_status: true
  use_kalman_eta: true          # Use Kalman-smoothed velocity for more stable ETA
  curved_projection: true       # Enable turn-rate-aware curved-path ETA projection

logging:
  level: info

web:
  origins: ["*"]

# CPR decode reference for ADS-B positions — not the geofence and not the ETA target.
home:
  latitude: 35.72748800696312
  longitude: -78.69594225530933

# Hex colors keyed by rule name (warn / alert below), not a built-in severity enum.
alert_colors:
  warn: "#f59e0b"
  alert: "#ef4444"

receivers:
  main:
    type: dump1090
    host: "${DUMP1090_HOST:-localhost}"
    port: 30002

# Zones are named polygons plus independent rules. A rule fires when EVERY
# `when` constraint holds — there is no implicit "inside the polygon" test.
# Tie a rule to this zone with eta, distance, or proximity.
# Units: altitude metres (not feet), speed km/h, eta seconds to the polygon
# boundary along the current track (0 if already inside), distance km,
# proximity metres. See UNITS.md.
zones:
  aerpaw:
    color: "#f59e0b"
    coordinates:
      [[35.72880524177751, -78.69547205552347],
       [35.73034893280391, -78.69655569423412],
       [35.73042523891949, -78.69927270421532],
       [35.73051937796792, -78.69979359958919],
       [35.73025504494631, -78.69996636483191],
       [35.72963634403818, -78.70015797188904],
       [35.72853405324059, -78.70082244524355],
       [35.7277702810421, -78.70036918438045],
       [35.726676628094, -78.70060532618695],
       [35.72643960060359, -78.70091702638037],
       [35.72546674963959, -78.70085337234642],
       [35.72532232027014, -78.69987708784484],
       [35.72367516334129, -78.69965597848201],
       [35.72323219047765, -78.6984075655389],
       [35.7228707358784, -78.69682632953729],
       [35.72299579019525, -78.69455868649942],
       [35.72227498046382, -78.69266389592191],
       [35.72261704091611, -78.69154013557741],
       [35.72495875238774, -78.6918103947614],
       [35.72498680577083, -78.6942162647356],
       [35.72702451963993, -78.69460914597411],
       [35.72710730577389, -78.69544717810703],
       [35.72689685266325, -78.69579545422093],
       [35.72695324876908, -78.69602442755915],
       [35.72718139200785, -78.69620041234603],
       [35.72746953931985, -78.69612885574327],
       [35.72880524177751, -78.69547205552347]]
    rules:
      - name: warn
        when:
          altitude: { max: 2000 }  # metres
          eta: { max: 120 }        # seconds to boundary (0 if already inside)
        dwell_seconds: 60          # on-delay; also history retain threshold
        on_activate:
          - method: print
          # Webhook URLs are secrets. Uncomment and export PYAERIAL_WEBHOOK_URL;
          # ${VAR} is expanded at load time (fails if the variable is unset).
          # - method: webhook
          #   options:
          #     url: "${PYAERIAL_WEBHOOK_URL}"
          #     format: discord
        on_deactivate:
          - method: print
        retain: true               # archive the flight after it expires, if dwell is met
      - name: alert
        when:
          altitude: { max: 1500 }  # metres
          eta: { max: 60 }         # seconds to boundary (0 if already inside)
        dwell_seconds: 60          # on-delay; also history retain threshold
        on_activate:
          - method: print
        on_deactivate:
          - method: print
        retain: true               # archive the flight after it expires, if dwell is met